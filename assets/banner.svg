<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Layer 1: Ambient Glowing Floating Orbs (Background Animations) -->
  <g opacity="0.6">
    <circle cx="200" cy="90" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.15">
      <animate attributeName="cy" values="90;130;90" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cx" values="200;240;200" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="300" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.18">
      <animate attributeName="cy" values="300;260;300" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cx" values="1020;980;1020" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="380" r="110" fill="#6366f1" filter="url(#glow)" opacity="0.12">
      <animate attributeName="cy" values="380;350;380" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Layer 2: Cloud / Infrastructure Constellation Lines (Behind Text) -->
  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="120" y1="210" x2="320" y2="280">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="320" y1="280" x2="520" y2="230">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="880" y1="140" x2="1080" y2="210">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="720" y1="90" x2="880" y2="140">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Network Floating Nodes -->
  <g fill="#38bdf8" opacity="0.5">
    <circle cx="120" cy="210" r="4">
      <animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="320" cy="280" r="5">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="720" cy="90" r="4">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="880" cy="140" r="5">
      <animate attributeName="r" values="5;8;5" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="210" r="4">
      <animate attributeName="r" values="3;6;3" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Layer 3: FOREGROUND CONTENT (Permanently in front & crisp) -->
  <g id="foreground">
    <!-- Category Pill Tag -->
    <rect x="445" y="48" width="310" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
    <circle cx="465" cy="65" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="480" y="70" class="tagline-text">Curated Awesome Directory</text>

    <!-- Main Title with Gradient fill -->
    <!-- Gradient for Main Title -->
    <text x="600" y="145" text-anchor="middle" class="title-text" filter="url(#softGlow)">Cloud Application Infrastructure</text>
    <text x="600" y="145" text-anchor="middle" class="title-text" fill="url(#accentGrad)">Cloud Application Infrastructure</text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" class="subtitle-text">
      Hyperscale Cloud Platforms • Self-Hosted PaaS • Infrastructure-as-Code • Kubernetes
    </text>

    <!-- Feature Badges / Technology Pills -->
    <g transform="translate(180, 240)">
      <!-- Pill 1: Compute & Bare Metal -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="21" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
        <circle cx="24" cy="21" r="7" fill="#38bdf8" />
        <text x="42" y="26" class="pill-text">⚡ Compute &amp; VMs</text>
      </g>

      <!-- Pill 2: Kubernetes & Containers -->
      <g transform="translate(200, 0)">
        <rect width="210" height="42" rx="21" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
        <circle cx="24" cy="21" r="7" fill="#818cf8" />
        <text x="42" y="26" class="pill-text">☸️ Kubernetes &amp; K3s</text>
      </g>

      <!-- Pill 3: Self-Hosted PaaS -->
      <g transform="translate(430, 0)">
        <rect width="200" height="42" rx="21" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1"/>
        <circle cx="24" cy="21" r="7" fill="#c084fc" />
        <text x="42" y="26" class="pill-text">🚀 Self-Hosted PaaS</text>
      </g>

      <!-- Pill 4: IaC & Automation -->
      <g transform="translate(650, 0)">
        <rect width="190" height="42" rx="21" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1"/>
        <circle cx="24" cy="21" r="7" fill="#2dd4bf" />
        <text x="42" y="26" class="pill-text">🛠️ OpenTofu &amp; IaC</text>
      </g>
    </g>

    <!-- Bottom Stat Bar in Banner -->
    <g transform="translate(300, 320)">
      <rect width="600" height="50" rx="25" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      
      <text x="110" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#38bdf8">10+ Top Hyperscalers</text>
      <line x1="210" y1="15" x2="210" y2="35" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>

      <text x="300" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#818cf8">17+ Open-Source Projects</text>
      <line x1="390" y1="15" x2="390" y2="35" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>

      <text x="490" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#34d399">100% Free &amp; Open</text>
    </g>
  </g>
</svg>
